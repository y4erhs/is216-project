<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FolderTabs Overflow Mode Sandbox (> 4 Tabs)</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-black: #0a1d2b;
      --color-white: #ffffff;
      --bg-page: #3b5bdb;
      --folder-green-bg: #c8ec5c;
      --folder-green-inner: #3a4e12;
      --folder-orange-bg: #ff7b4f;
      --folder-orange-inner: #6e2912;
      --folder-purple-bg: #e781ff;
      --folder-purple-inner: #531c63;
      --folder-blue-bg: #496eec;
      --folder-blue-inner: #1e3a8a;
      --folder-yellow-bg: #f6bc3f;
      --folder-yellow-inner: #78350f;
      --folder-red-bg: #e63c25;
      --folder-red-inner: #7f1d1d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-page);
      font-family: 'Nunito', sans-serif;
      padding: 30px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-screen {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header-style {
      font-family: 'Fredoka', cursive, sans-serif;
      text-transform: uppercase;
      font-weight: 800;
    }

    .page-title {
      color: white;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .controls {
      background: white;
      padding: 12px 18px;
      border-radius: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-weight: 700;
      color: #0a1d2b;
    }

    .controls button {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #f1f5f9;
      cursor: pointer;
      font-weight: 700;
    }
    .controls button:hover { background: #e2e8f0; }

    /* THEMES */
    .theme-green { --bg: var(--folder-green-bg); --bg-dark: var(--folder-green-inner); --text: var(--color-black); }
    .theme-orange { --bg: var(--folder-orange-bg); --bg-dark: var(--folder-orange-inner); --text: var(--color-black); }
    .theme-purple { --bg: var(--folder-purple-bg); --bg-dark: var(--folder-purple-inner); --text: var(--color-black); }
    .theme-blue { --bg: var(--folder-blue-bg); --bg-dark: var(--folder-blue-inner); --text: var(--color-white); }
    .theme-yellow { --bg: var(--folder-yellow-bg); --bg-dark: var(--folder-yellow-inner); --text: var(--color-black); }
    .theme-red { --bg: var(--folder-red-bg); --bg-dark: var(--folder-red-inner); --text: var(--color-white); }

    /* FOLDER TABS CONTAINER */
    .folder-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      position: relative;
    }

    .tabs-header {
      display: flex;
      align-items: flex-end;
      margin-bottom: -1px;
      width: 100%;
      position: relative;
      gap: 8px; /* Mode Normal: Renggang & Lebar */
    }

    .folder-tab {
      position: relative;
      display: inline-flex;
      align-items: center;
      border: none;
      outline: none;
      font-family: inherit;
      cursor: pointer;
      user-select: none;
      background-color: var(--bg, #d1d5db);
      color: var(--text, #1f2937);

      height: 40px;
      padding: 0 18px 0 20px;
      border-top-left-radius: 16px;
      border-top-right-radius: 0;

      flex: 1 1 auto;
      min-width: 90px;
      max-width: 160px;
      margin-right: 0; 
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* OVERFLOW MODE (tabs.length > 4) */
    .tabs-header.overflow-mode {
      gap: 0px;
    }

    .tabs-header.overflow-mode .folder-tab {
      flex: 1 1 50px;
      min-width: 45px;
      max-width: 95px;
      margin-right: -16px;
      padding: 0 4px 0 14px;
    }

    .tabs-header.overflow-mode .folder-tab:not(:first-child):hover {
      flex: 0 1 150px;
      max-width: 150px;
      margin-left: 16px;
      z-index: 50;
    }

    .tabs-header.overflow-mode .folder-tab:first-child:hover {
      flex: 0 1 150px;
      max-width: 150px;
      margin-left: 0 !important;
      z-index: 50;
    }

    .folder-tab::after {
      content: '';
      position: absolute;
      left: 100%;
      bottom: 0;
      width: 26px;
      height: 100%;
      background-color: inherit;
      clip-path: path('M 0 0 L 2 0 Q 14 0, 18 12 L 26 40 L 0 40 Z');
      pointer-events: none;
    }

    .folder-tab.active {
      filter: brightness(1);
      z-index: 90 !important;
    }

    .folder-tab-text {
      font-size: 11.5px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      width: 100%;
      text-align: center;
    }

    /* FOLDER BODY */
    .folder-body {
      position: relative;
      background-color: var(--bg, #d1d5db);
      border-radius: 25px;
      border-top-left-radius: 0;
      padding: 12px;
      width: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.2);
    }

    .inner-folder {
      background-color: var(--bg-dark, #9ca3af);
      border-radius: 18px;
      padding: 24px;
      min-height: 320px;
      color: white;
      font-size: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div id="app" class="app-screen">
  <h1 class="header-style page-title">TESTING DYNAMIC FOLDER TABS</h1>
  
  <div class="controls">
    <span>Number of tabs: <b>{{ tabs.length }}</b></span>
    <button @click="toggleTabs">Switch Mode (≤ 4 vs > 4 Tabs)</button>
  </div>

  <div class="folder-container">
    <div class="tabs-header" :class="{ 'overflow-mode': tabs.length > 4 }">
      <button
        v-for="(tab, index) in tabs"
        :key="tab.id"
        type="button"
        :class="['folder-tab', tab.theme, { active: activeTab === tab.id }]"
        :style="{ zIndex: activeTab === tab.id ? 20 : (10 - index) }"
        @click="activeTab = tab.id"
      >
        <span class="header-style folder-tab-text">{{ tab.label }}</span>
      </button>
    </div>

    <div v-for="tab in tabs" :key="tab.id" v-show="activeTab === tab.id" :class="['folder-body', tab.theme]">
      <div class="inner-folder">
        <p>CONTENT: <b>{{ tab.label }}</b></p>
      </div>
    </div>
  </div>
</div>

<script>
  const { createApp, ref } = Vue;

  createApp({
    setup() {
      const mode = ref('normal'); // 'normal' (3 tabs) atau 'overflow' (6 tabs)
      
      const normalTabs = [
        { id: 'for-you', label: 'FOR YOU', theme: 'theme-green' },
        { id: 'ai', label: 'AI', theme: 'theme-orange' },
        { id: 'tech', label: 'TECH', theme: 'theme-purple' }
      ];

      const manyTabs = [
        { id: 'for-you', label: 'FOR YOU', theme: 'theme-green' },
        { id: 'ai', label: 'AI', theme: 'theme-orange' },
        { id: 'tech', label: 'TECH', theme: 'theme-purple' },
        { id: 'workshop', label: 'WORKSHOP', theme: 'theme-blue' },
        { id: 'finance', label: 'FINANCE', theme: 'theme-yellow' },
        { id: 'music', label: 'MUSIC', theme: 'theme-red' }
      ];

      const tabs = ref(normalTabs);
      const activeTab = ref('for-you');

      const toggleTabs = () => {
        if (tabs.value.length <= 3) {
          tabs.value = manyTabs;
        } else {
          tabs.value = normalTabs;
          activeTab.value = 'for-you';
        }
      };

      return { tabs, activeTab, toggleTabs };
    }
  }).mount('#app');
</script>

</body>
</html>
